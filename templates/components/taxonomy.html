{%- component terminus.prettify_term(term: string, @taxonomy) -%}
    {%- if taxonomy.name == "categories" -%}
        {{- "{" ~ term ~ "}" | safe -}}
    {%- elif taxonomy.name == "tags" -%}
        {{- "#" ~ term | safe -}}
    {%- else -%}
        {{- term | safe -}}
    {%- endif -%}
{%- endcomponent terminus.prettify_term -%}
