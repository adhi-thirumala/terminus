{% if config.extra?.content_security_policy?.enable == true -%}
<meta http-equiv="Content-Security-Policy" content="default-src 'self'
    {%- set allowed_domains = [] -%}

    {#- Allow WebSocket protocol if served via `zola serve` -#}
    {%- if config.mode == "serve" -%}
        {%- set allowed_domains = [
            ...allowed_domains,
            {"directive": "connect-src", "domains": ["'self'", "ws:"]},
            {"directive": "script-src-elem", "domains": ["'self'", "'unsafe-inline'"]},
        ] -%}
    {%- endif -%}

    {#- Allow `data:` URL scheme if emoji-based favicon is used -#}
    {%- if config.extra.favicon_emoji -%}
        {%- set allowed_domains = [...allowed_domains, {"directive": "img-src", "domains": ["'self'", "data:"]}] -%}
    {%- endif -%}

    {#- Allow inline CSS if Zola syntax highlighting is enabled -#}
    {%- if config.markdown.highlighting -%}
        {%- set allowed_domains = [...allowed_domains, {"directive": "style-src-attr", "domains": ["'unsafe-inline'"]}] -%}
    {%- endif -%}

    {%- set extra_domains = config.extra.content_security_policy.allowed_domains | default(value=[]) -%}
    {%- set allowed_domains = [...allowed_domains, ...extra_domains] -%}

    {%- for directive, entries in allowed_domains | group_by(attribute="directive") -%}
        {%- set_global domains = [] -%}

        {%- for entry in entries -%}
            {%- set_global domains = [...domains, ...entry.domains] | unique -%}
        {%- endfor -%}

        {%- set domains_str = domains | join(sep=" ") -%}
        {%- if domains_str -%}
            ; {{ directive }} {{ domains_str | safe }}
        {%- endif -%}
    {%- endfor -%}
">
{% endif -%}
